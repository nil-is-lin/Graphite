# Release workflow
#
# Builds the Graphite desktop app using the project's PROVEN build pipeline
# (see .github/workflows/build.yml) and publishes the bundles to a GitHub
# Release.
#
# cargo-dist is intentionally NOT used here: its internal linkage-analysis
# step races with this CEF-heavy desktop build and double-extends object-file
# paths (e.g. "...rcgu.o.rcgu.o"), which breaks the Windows/Linux builds. The
# project's own CI never uses cargo-dist for the actual build, so we mirror
# that instead. (Supersedes ADR-004's "Option A" cargo-dist delivery.)
#
# Triggers:
#   * push of a version tag (vX.Y.Z)  -> full release
#   * workflow_dispatch with a `tag`  -> manual re-release

name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      WASM_BINDGEN_CLI_VERSION: "0.2.121"
      BINARYEN_VERSION: "130"
      CARGO_ABOUT_VERSION: "0.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          cache: false
          rustflags: ""
          target: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install native dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BINSTALL_DISABLE_TELEMETRY: "true"
        run: |
          winget install --id LLVM.LLVM -e --accept-package-agreements --accept-source-agreements
          winget install --id Kitware.CMake -e --accept-package-agreements --accept-source-agreements
          winget install --id OpenSSL.OpenSSL -e --accept-package-agreements --accept-source-agreements
          winget install --id GnuWin32.PkgConfig -e --accept-package-agreements --accept-source-agreements

          "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=C:\Program Files\OpenSSL-Win64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append

          curl.exe -sSfL -o "$env:RUNNER_TEMP\binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/version_$env:BINARYEN_VERSION/binaryen-version_$env:BINARYEN_VERSION-x86_64-windows.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\binaryen.tar.gz" -C $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\binaryen-version_$env:BINARYEN_VERSION\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

          cargo binstall --no-confirm --force "cargo-about@$env:CARGO_ABOUT_VERSION"
          cargo binstall --no-confirm --force "wasm-bindgen-cli@$env:WASM_BINDGEN_CLI_VERSION"

      - name: Fetch dependencies (warm cargo cache for offline license generation)
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --target wasm32-unknown-unknown || true

      - name: Build desktop bundle
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: cargo run build desktop

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/Graphite -DestinationPath graphite-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: graphite-windows-x64
          path: graphite-windows-x64.zip
          compression-level: 0

  macos-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    env:
      WASM_BINDGEN_CLI_VERSION: "0.2.121"
      BINARYEN_VERSION: "130"
      CARGO_ABOUT_VERSION: "0.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          cache: false
          rustflags: ""
          target: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BINSTALL_DISABLE_TELEMETRY: "true"
        run: |
          brew update
          brew install \
            pkg-config \
            openssl@3 \
            llvm \
            cargo-binstall

          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

          BINARYEN_DIR="$HOME/.cache/binaryen-version_$BINARYEN_VERSION"
          if [ ! -x "$BINARYEN_DIR/bin/wasm-opt" ]; then
            mkdir -p "$BINARYEN_DIR"
            curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-arm64-macos.tar.gz" | tar xz -C "$BINARYEN_DIR" --strip-components=1
          fi
          echo "$BINARYEN_DIR/bin" >> $GITHUB_PATH

          cargo binstall --no-confirm --force "cargo-about@${CARGO_ABOUT_VERSION}"
          cargo binstall --no-confirm --force "wasm-bindgen-cli@${WASM_BINDGEN_CLI_VERSION}"

      - name: Fetch dependencies (warm cargo cache for offline license generation)
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --target wasm32-unknown-unknown || true

      - name: Build desktop bundle
        env:
          CARGO_TERM_COLOR: always
        run: cargo run build desktop

      - name: Package
        run: ditto -c -k --keepParent target/release/Graphite.app graphite-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: graphite-macos-arm64
          path: graphite-macos-arm64.zip
          compression-level: 0

  macos-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15-intel
    env:
      WASM_BINDGEN_CLI_VERSION: "0.2.121"
      BINARYEN_VERSION: "130"
      CARGO_ABOUT_VERSION: "0.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
          cache: false
          rustflags: ""
          target: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BINSTALL_DISABLE_TELEMETRY: "true"
        run: |
          brew update
          brew install \
            pkg-config \
            openssl@3 \
            llvm \
            cargo-binstall

          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

          BINARYEN_DIR="$HOME/.cache/binaryen-version_$BINARYEN_VERSION"
          if [ ! -x "$BINARYEN_DIR/bin/wasm-opt" ]; then
            mkdir -p "$BINARYEN_DIR"
            curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-macos.tar.gz" | tar xz -C "$BINARYEN_DIR" --strip-components=1
          fi
          echo "$BINARYEN_DIR/bin" >> $GITHUB_PATH

          cargo binstall --no-confirm --force "cargo-about@${CARGO_ABOUT_VERSION}"
          cargo binstall --no-confirm --force "wasm-bindgen-cli@${WASM_BINDGEN_CLI_VERSION}"

      - name: Fetch dependencies (warm cargo cache for offline license generation)
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --target wasm32-unknown-unknown || true

      - name: Build desktop bundle
        env:
          CARGO_TERM_COLOR: always
        run: cargo run build desktop

      - name: Package
        run: ditto -c -k --keepParent target/release/Graphite.app graphite-macos-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: graphite-macos-x64
          path: graphite-macos-x64.zip
          compression-level: 0

  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://graphite.cachix.org https://graphite-dev.cachix.org
            extra-trusted-public-keys = graphite.cachix.org-1:B7Il1yMpkquN/dXM+5GRmz+4Xmu2aaCS1GcWNfFhsOo= graphite-dev.cachix.org-1:RppXYpiV1qO2TYKTkXXGHsAEQDOB5G51b3VlrN9QmbI=

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Build Linux bundle
        run: nix build .#graphite-bundle.tar.xz && cp ./result graphite-linux-x64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: graphite-linux-x64
          path: graphite-linux-x64.tar.xz
          compression-level: 0

  publish:
    needs: [windows, macos-arm64, macos-x64, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: graphite-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          # Clean up any partial release left by a previous failed cargo-dist run
          gh release delete "$TAG" --yes || true

          PREV=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -1)
          if [ -n "$PREV" ]; then
            NOTES=$(git log "${PREV}..HEAD" --oneline)
          else
            NOTES=$(git log --oneline -20)
          fi

          gh release create "$TAG" \
            --title "Graphite $TAG" \
            --notes "$NOTES" \
            artifacts/*
