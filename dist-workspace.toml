# dist-workspace.toml
#
# cargo-dist configuration for Graphite desktop binary releases.
#
# ⚠️ SCAFFOLD — not yet validated. Run `cargo dist init` on a networked macOS
#    machine (with cargo-dist installed) to pin `cargo-dist-version` to the
#    installed release and generate `.github/workflows/release.yml`. The values
#    below are sensible defaults; `cargo dist init` will correct/extend them.
#
# Why cargo-dist (see docs/adr/ADR-004-cargo-dist-release-tooling.md):
#   Replaces the hand-rolled `desktop/bundle` crate (Linux is still a TODO stub)
#   and the Nix/Flatpak CI with a single, framework-agnostic release pipeline.
#   The webview host choice (CEF vs Wry) is INDEPENDENT of this — cargo-dist only
#   packages and publishes; it does not care how the binary was built.

[workspace.metadata.dist]
cargo-dist-version = "0.13.0"
ci = ["github"]
installers = ["pkg", "msi", "deb", "rpm", "appimage"]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Graphite-specific integration notes (carry into the generated release.yml;
# validate on a Mac with `cargo dist init`):
# - Desktop binary is `graphite` from package `graphite-desktop`.
# - cargo-dist packages `cargo build --release` output. Graphite's distributable
#   .app/.folder is assembled by `desktop/bundle` via
#   `cargo run -p cargo-run -- build desktop`. The release workflow must run that
#   bundle step, then hand the artifact to cargo-dist (or keep `desktop/bundle`
#   and let cargo-dist wrap its output). See ADR-004 for the trade-off.
# - Scope distribution to the `graphite` binary only; the workspace also builds
#   `graphene-cli` (node-graph) which should NOT be shipped as a desktop release.
