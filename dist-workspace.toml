# dist-workspace.toml
#
# cargo-dist configuration for Graphite desktop binary releases.
#
# Managed by cargo-dist v0.32.0. Invoke with the `dist` binary (NOT `cargo dist`):
#     source "$HOME/.cargo/env"
#     dist generate     # re-emit .github/workflows/release.yml from this file
#     dist build        # local dry-run of the release build
#
# Format (cargo-dist v0.32.0) — TWO required pieces:
#   1. A `[workspace]` root table with `members = ["cargo:."]` is MANDATORY
#      (dist errors with "must have one of [workspace] or [package]" without it).
#   2. Dist settings live under the TOP-LEVEL `[dist]` table. The legacy
#      `[workspace.metadata.dist]` form is IGNORED by v0.32.0 — do not use it.
#   `dist init` rewrites this file and resets `installers` to []; re-run
#   `dist generate` (NOT `dist init`) after editing to avoid clobbering.
#
#   GOTCHA — cargo-dist v0.32.0 `--print=linkage` build bug:
#   `dist generate` also rewrites `.github/workflows/release.yml` and re-adds
#   `dist build ... --print=linkage`. That flag triggers cargo-dist's linkage
#   report, which double-appends the object-file extension (e.g.
#   "...rcgu.o.rcgu.o"). The Windows linker then fails with LNK1104 and Linux
#   rustc fails with "could not write output ... permission denied" while building
#   the graphite desktop binary (macOS tolerates it). After ANY `dist generate`,
#   remove `--print=linkage` from the `dist build` line in release.yml (see the
#   inline comment there). A plain `dist build` still produces the binary + archive.
#
# Why cargo-dist (see docs/adr/ADR-004-cargo-dist-release-tooling.md):
#   Framework-agnostic release pipeline that generates per-OS installers
#   (shell/msi/pkg/...) and uploads them to GitHub Releases. cargo-dist ONLY
#   packages/publishes the `cargo build --release` output (Option A: bare binary
#   archives/installers); it does NOT assemble Graphite's .app/.folder. The
#   webview host (CEF vs Wry, ADR-002) is INDEPENDENT of this layer.
#
# IMPORTANT — Graphite-specific integration (NOT yet wired into release.yml):
#   - Desktop binary is `graphite` from package `graphite-desktop`.
#   - `desktop/bundle` is STILL the active packager: `cargo run -p cargo-run --
#     build desktop` invokes it (tools/cargo-run/src/main.rs) to assemble
#     Graphite.app (macOS) / Graphite/ (Windows). It is NOT yet replaced by
#     cargo-dist — its removal is a DEFERRED follow-up (ADR-004) that requires
#     (a) cargo-dist .app assembly wiring AND (b) ADR-002 (drop CEF) landing
#     first. Do NOT delete `desktop/bundle` until BOTH are done.
#   - Scope distribution to the `graphite` binary only; the workspace also builds
#     `graphene-cli` (node-graph) which must NOT ship as a desktop release.

[workspace]
members = ["cargo:."]

[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# v0.32.0 valid kinds: shell, powershell, npm, homebrew, msi, pkg.
# NOTE: deb/rpm/appimage are NOT supported in v0.32.0 (added in later
# releases) — Linux ships the raw tarball/zip + the `shell` installer for now.
installers = ["shell"]
# First release (Option A): universal `shell` installer (curl|sh) covers
# macOS/Windows/Linux via the raw .tar.gz/.zip archives — no per-package WiX
# pollution, no signing burden. Add `msi`/`pkg` later once distribution is
# scoped to `graphite-desktop` only and code-signing is wired up (see ADR-004).
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
